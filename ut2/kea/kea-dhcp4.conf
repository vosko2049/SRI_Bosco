// Plantilla Tarea 1 - Kea DHCP
// Cambia todas las XX por tu numero (sin ceros delante: 07 -> 7),
// ens33 por el nombre de tu tarjeta y la MAC por la de tu wClienteXX.
{
  "Dhcp4": {
    "interfaces-config": {
      "interfaces": [ "ens33" ]
    },
    "lease-database": {
      "type": "memfile",
      "persist": true,
      "name": "/var/lib/kea/kea-leases4.csv"
    },
    // 10 dias = 864000 segundos
    "valid-lifetime": 864000,
    "renew-timer": 43200,
    "rebind-timer": 756000,
    "subnet4": [
      {
        "id": 1,
        "subnet": "192.168.15.0/24",
        "user-context": { "name": "RedLocal15" },
        // Rango partido en dos para excluir la .125-.134 (uServer15)
        "pools": [
          { "pool": "192.168.15.75 - 192.168.15.124" },
          { "pool": "192.168.15.135 - 192.168.15.175" }
        ],
        "option-data": [
          { "name": "routers", "data": "192.168.15.1" },
          { "name": "domain-name-servers", "data": "10.0.1.48, 8.8.8.8"},
          { "name": "domain-name", "data": "semaforo.test" }
        ],
        "reservations": [
          {
            "hw-address": "00:0C:29:45:E9:82",
            "ip-address": "192.168.15.18",
            "hostname": "wCliente15"
          }
        ]
      }
    ]
  }
}